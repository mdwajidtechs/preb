<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PreBooking Shop</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      background: linear-gradient(135deg,#0f172a,#1e293b,#111827);
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      color:white;
    }

    .background-circle{
      position:absolute;
      border-radius:50%;
      filter: blur(80px);
      opacity:0.3;
    }

    .circle1{
      width:300px;
      height:300px;
      background:#2563eb;
      top:-100px;
      left:-100px;
    }

    .circle2{
      width:350px;
      height:350px;
      background:#06b6d4;
      bottom:-120px;
      right:-120px;
    }

    .container{
      position:relative;
      width:90%;
      max-width:500px;
      background: rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(18px);
      border-radius:25px;
      padding:50px 35px;
      text-align:center;
      box-shadow:0 15px 40px rgba(0,0,0,0.4);
      animation: floatCard 3s ease-in-out infinite;
    }

    @keyframes floatCard{
      0%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-8px);
      }
      100%{
        transform:translateY(0px);
      }
    }

    .logo{
      width:90px;
      height:90px;
      background:linear-gradient(135deg,#3b82f6,#06b6d4);
      border-radius:20px;
      margin:auto;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:38px;
      font-weight:bold;
      box-shadow:0 10px 25px rgba(59,130,246,0.5);
    }

    h1{
      margin-top:25px;
      font-size:36px;
      font-weight:700;
      letter-spacing:1px;
    }

    p{
      margin-top:15px;
      color:#d1d5db;
      font-size:16px;
      line-height:1.7;
    }

    .btn{
      display:inline-block;
      margin-top:35px;
      padding:16px 38px;
      background:linear-gradient(135deg,#2563eb,#06b6d4);
      color:white;
      text-decoration:none;
      border-radius:50px;
      font-size:18px;
      font-weight:bold;
      transition:0.3s ease;
      box-shadow:0 10px 25px rgba(37,99,235,0.45);
    }

    .btn:hover{
      transform:translateY(-3px) scale(1.03);
      box-shadow:0 15px 35px rgba(6,182,212,0.55);
    }

    .footer{
      margin-top:25px;
      font-size:14px;
      color:#94a3b8;
    }

    @media(max-width:600px){
      h1{
        font-size:28px;
      }

      p{
        font-size:15px;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <div class="background-circle circle1"></div>
  <div class="background-circle circle2"></div>

  <div class="container">

    <div class="logo">🛍</div>

    <h1>PreBooking Shop</h1>

    <p>
      Welcome to our professional business platform.  
      Explore premium shopping services, smart booking solutions, 
      and seamless online experiences.
    </p>

    <a class="btn" href="https://shop.prebooking.shop/" target="_blank">
      Visit Website
    </a>

    <div class="footer">
      Powered by Business Innovation
    </div>

  </div>

</body>
</html>
